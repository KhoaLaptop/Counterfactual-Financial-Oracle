name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r counterfactual_oracle/requirements.txt

    - name: Lint with ruff
      run: |
        ruff check counterfactual_oracle/src
        ruff format --check counterfactual_oracle/src

    - name: Type check with mypy
      run: |
        mypy counterfactual_oracle/src --ignore-missing-imports

    - name: Security check with bandit
      run: |
        bandit -r counterfactual_oracle/src -f json -o bandit-report.json || true

    - name: Run tests with pytest
      run: |
        pytest counterfactual_oracle/tests -v --cov=counterfactual_oracle/src --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    
    - name: Check for secrets
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --debug --only-verified

  docker:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker image
      run: |
        docker build -t counterfactual-oracle:latest .
    
    - name: Test Docker image
      run: |
        docker run --rm counterfactual-oracle:latest python -c "import counterfactual_oracle; print('OK')"
